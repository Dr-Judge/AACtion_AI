# 가비아 클라우드(해커톤 지원, 8/28까지 한시적) 단독 서버에서 AI 서비스만 띄운다.
# Dr-Judge(Spring)는 다른 서버(AWS EC2)에 있고, AI_SERVICE_BASE_URL로 이 서버의
# 공인 IP를 가리키게 설정한다.
services:
  ai-service:
    image: hyunj11/aaction_ai:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8000:8000"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_PERSIST_DIR: /app/data/chroma
      # 인제스트 배치(ingest.py, sync_archive_csv.py)가 Dr-Judge 운영 MySQL(AWS EC2)을
      # 직접 읽어야 해서 필요 — 실시간 요청 경로는 이 값들을 안 쓴다(docs/AI_SERVICE_CONTRACT.md 5번).
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
    volumes:
      - ai_chroma_data:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ai_chroma_data:
